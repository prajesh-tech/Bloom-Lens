name: BloomLens checks
on:
  pull_request:
  push:
    branches: [main, Dev2]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m venv .venv
        working-directory: backend
      - run: .venv/bin/pip install --require-hashes -r requirements.lock
        working-directory: backend
      - run: .venv/bin/pytest tests/ -v
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run type-check && npm run lint && npm run test && npm run build
        working-directory: frontend
